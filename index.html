<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<script>
  (() => {
    const saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<title>TESLA DOC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── Design tokens (light & dark · violet accents) ────────────────────── */
:root {
  --bg:          #ffffff;              /* pure white canvas */
  --header:      rgba(250, 250, 250, 0.94); /* off-white header with subtle glass translucency */
  --surface:     #ffffff;             /* card surface */
  --surface-h:   #f5f5f5;            /* hover / elevated surface */
  --hover-ol:    rgba(0,0,0,.04);     /* alpha hover overlay */
  --active-ol:   rgba(0,0,0,.07);     /* active/selected overlay */
  --border:      rgba(0,0,0,.1);      /* standard border */
  --border-soft: rgba(0,0,0,.06);     /* subtle dividers */
  --text:        #0a0a0a;            /* near-black primary text */
  --muted:       #6b6b6b;            /* secondary text */
  --dim:         rgba(0,0,0,.35);     /* placeholder / disabled */

  /* Violet family — used for all accent/interactive colour */
  --accent:      #6d28d9;            /* violet-700 */
  --accent-h:    #7c3aed;            /* violet-600, brighter hover */
  --accent-soft: rgba(109,40,217,.1);
  --mark-bg:     rgba(109,40,217,.12);
  --mark-text:   #4c1d95;            /* violet-900 */

  --cdot-l:      42%;
  --stripe-l:    46%;
  --cat-l:       36%;

  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   8px;

  /* Smooth animation curves & timings */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t:           background-color 140ms ease, border-color 140ms ease,
                 color 140ms ease, opacity 140ms ease;
  --font: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Helvetica, Arial, sans-serif;
}

[data-theme="dark"] {
  --bg:          #191919;
  --header:      rgba(26, 26, 26, 0.94);
  --surface:     #222222;
  --surface-h:   #2a2a2a;
  --hover-ol:    rgba(255, 255, 255, .05);
  --active-ol:   rgba(255, 255, 255, .09);
  --border:      rgba(255, 255, 255, .12);
  --border-soft: rgba(255, 255, 255, .07);
  --text:        #f0f0f0;
  --muted:       #a0a0a0;
  --dim:         rgba(255, 255, 255, .4);

  --accent:      #a78bfa;
  --accent-h:    #c4b5fd;
  --accent-soft: rgba(167, 139, 250, .15);
  --mark-bg:     rgba(167, 139, 250, .22);
  --mark-text:   #ede9fe;

  --cdot-l:      62%;
  --stripe-l:    58%;
  --cat-l:       68%;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #191919;
    --header:      rgba(26, 26, 26, 0.94);
    --surface:     #222222;
    --surface-h:   #2a2a2a;
    --hover-ol:    rgba(255, 255, 255, .05);
    --active-ol:   rgba(255, 255, 255, .09);
    --border:      rgba(255, 255, 255, .12);
    --border-soft: rgba(255, 255, 255, .07);
    --text:        #f0f0f0;
    --muted:       #a0a0a0;
    --dim:         rgba(255, 255, 255, .4);

    --accent:      #a78bfa;
    --accent-h:    #c4b5fd;
    --accent-soft: rgba(167, 139, 250, .15);
    --mark-bg:     rgba(167, 139, 250, .22);
    --mark-text:   #ede9fe;

    --cdot-l:      62%;
    --stripe-l:    58%;
    --cat-l:       68%;
  }
}

/* ─── Reset & base ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  min-height: 100dvh;
}

button {
  font: inherit;
  color: inherit;
  -webkit-appearance: none;
  appearance: none;
  touch-action: manipulation;
  cursor: pointer;
  background: none;
  border: none;
  -webkit-tap-highlight-color: transparent;
}

button::-moz-focus-inner {
  border: 0;
  padding: 0;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
  transition: outline-offset 140ms var(--ease-out);
}

::selection { background: rgba(109,40,217,.2); color: var(--text); }

mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  border-radius: 2px;
  padding: 0 2px;
  transition: background-color 160ms ease, color 160ms ease;
}

/* max 600 weight — Notion never uses bold/700 in workspace UI */
strong { font-weight: 600; }

/* ─── Keyframe Animations ──────────────────────────────────────────────── */
@keyframes itemSlideFade {
  0% {
    opacity: 0;
    transform: translateY(6px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulseGlow {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

@keyframes floatSlow {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* ─── App shell ─────────────────────────────────────────────────────────── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  /* Notion: translucent sticky bar with smooth backdrop blur */
  background: var(--header);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: border-color 200ms ease, box-shadow 200ms ease, background-color 200ms ease;
}

.app-header.scrolled {
  border-bottom-color: rgba(0,0,0,.12);
  box-shadow: 0 4px 20px rgba(0,0,0,.04);
}

.header-inner {
  max-width: 760px;
  margin: 0 auto;
  padding: 14px 24px 0;
}

/* ─── App title / breadcrumb bar ───────────────────────────────────────── */
.app-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.app-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 0;
  user-select: none;
}

.theme-toggle {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: var(--t), transform 160ms var(--ease-spring);
  cursor: pointer;
  background: transparent;
}

.theme-toggle:hover {
  color: var(--text);
  background: var(--hover-ol);
  border-color: var(--border);
  transform: scale(1.05);
}

.theme-toggle:active {
  transform: scale(0.95);
}

.theme-toggle svg {
  width: 16px;
  height: 16px;
  display: block;
}

.theme-toggle .sun-icon { display: none; }
.theme-toggle .moon-icon { display: block; }

[data-theme="dark"] .theme-toggle .sun-icon { display: block; }
[data-theme="dark"] .theme-toggle .moon-icon { display: none; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-toggle .sun-icon { display: block; }
  :root:not([data-theme="light"]) .theme-toggle .moon-icon { display: none; }
}

.app-title-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  opacity: .7;
  flex-shrink: 0;
  transition: transform 220ms var(--ease-spring), opacity 180ms ease, color 180ms ease;
}

.app-title:hover .app-title-icon {
  opacity: 1;
  color: var(--accent);
  transform: scale(1.1) rotate(-4deg);
}

.app-title-icon svg { width: 16px; height: 16px; stroke-width: 1.75; }

.app-title-text {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  opacity: .85;
  letter-spacing: -.01em;
  transition: opacity 180ms ease, color 180ms ease;
}

.app-title:hover .app-title-text {
  opacity: 1;
}

/* ─── Search bar ────────────────────────────────────────────────────────── */
.search-wrap {
  position: relative;
  margin-bottom: 10px;
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--dim);
  pointer-events: none;
  stroke-width: 2;
  transition: color 180ms ease, transform 180ms var(--ease-out);
}

.search-wrap:focus-within .search-icon {
  color: var(--accent);
  transform: translateY(-50%) scale(1.08);
}

.search-wrap input {
  width: 100%;
  height: 34px;
  background: var(--hover-ol);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  color: var(--text);
  font: inherit;
  font-size: 14px;
  padding: 0 36px 0 32px;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  transition: background-color 180ms ease, border-color 180ms ease, box-shadow 200ms var(--ease-out), transform 180ms var(--ease-out);
}

.search-wrap input::placeholder {
  color: var(--dim);
  transition: color 180ms ease, opacity 180ms ease;
}

.search-wrap input::-webkit-search-cancel-button,
.search-wrap input::-webkit-search-decoration { -webkit-appearance: none; display: none; }

.search-wrap input:hover {
  background: var(--surface-h);
  border-color: var(--border);
}

.search-wrap input:focus {
  background: var(--surface);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 2px 8px var(--accent-soft);
}

.search-clear {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%) scale(0.7);
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms ease, transform 200ms var(--ease-spring), background-color 120ms ease, color 120ms ease;
}

.has-q .search-clear {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(-50%) scale(1);
}

.search-clear:hover {
  color: var(--text);
  background: var(--hover-ol);
  transform: translateY(-50%) scale(1.08);
}

.search-clear:active {
  transform: translateY(-50%) scale(0.92);
}

.search-clear svg { width: 13px; height: 13px; stroke-width: 2.5; }

/* ─── Filter chips ──────────────────────────────────────────────────────── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 3px;
  overflow-x: auto;
  margin: 0 -24px;
  padding: 0 24px;
  padding-bottom: 2px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.filter-bar::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  height: 27px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease, transform 160ms var(--ease-spring), box-shadow 150ms ease;
  white-space: nowrap;
  letter-spacing: -.005em;
  user-select: none;
}

.chip:hover {
  color: var(--text);
  background: var(--hover-ol);
  transform: translateY(-1px);
}

.chip:active {
  transform: translateY(0) scale(0.96);
}

.chip[aria-pressed="true"] {
  color: var(--accent);
  background: var(--active-ol);
  border-color: var(--border);
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.chip-count {
  font-size: 11px;
  font-weight: 400;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
  transition: color 150ms ease;
}

.chip[aria-pressed="true"] .chip-count {
  color: var(--accent);
  opacity: .8;
}

/* Category color dot */
.cdot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  background: hsl(var(--ch) var(--cs, 65%) var(--cdot-l, 42%));
  transition: transform 220ms var(--ease-spring), background-color 180ms ease;
}

.chip:hover .cdot {
  transform: scale(1.25);
}

.chip[aria-pressed="true"] .cdot {
  transform: scale(1.3);
}

/* ─── Divider line below header ─────────────────────────────────────────── */
.header-bottom-rule {
  height: 1px;
  background: var(--border);
  margin-top: 10px;
  transition: background-color 200ms ease;
}

/* ─── Main content ──────────────────────────────────────────────────────── */
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 24px 24px calc(env(safe-area-inset-bottom) + 64px);
}

/* ─── Status line ───────────────────────────────────────────────────────── */
.status-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--dim);
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 20px;
  min-height: 20px;
  transition: opacity 180ms ease, color 180ms ease;
}

/* ─── Category group header ─────────────────────────────────────────────── */
.group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 36px 0 6px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-soft);
  animation: itemSlideFade 240ms var(--ease-out) both;
}

.group-header:first-of-type { margin-top: 0; }

.group-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color 180ms ease;
}

.group-count {
  font-size: 11px;
  font-weight: 400;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}

/* ─── Cards ─────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 4px;
  overflow: hidden;
  transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out), border-color 160ms ease, background-color 160ms ease;
  animation: itemSlideFade 240ms var(--ease-out) both;
  animation-delay: calc(var(--anim-i, 0) * 16ms);
}

.card:hover {
  border-color: var(--border);
  box-shadow: 0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.03);
  transform: translateY(-1px);
}

[data-theme="dark"] .card:hover {
  border-color: rgba(255, 255, 255, .2);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .card:hover {
    border-color: rgba(255, 255, 255, .2);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
  }
}

.card:active {
  transform: translateY(0);
}

/* coloured left accent bar */
.card-head {
  display: flex;
  align-items: flex-start;
  gap: 0;
  width: 100%;
  min-height: 52px;
  padding: 0;
  text-align: left;
  position: relative;
  user-select: none;
}

/* The thin left-side coloured stripe */
.card-stripe {
  width: 3px;
  align-self: stretch;
  flex-shrink: 0;
  background: hsl(var(--ch) var(--cs, 65%) var(--stripe-l, 46%));
  border-radius: var(--radius-lg) 0 0 var(--radius-lg);
  transition: opacity 180ms ease, width 180ms var(--ease-out), background-color 180ms ease;
}

.card:not(.open) .card-stripe { opacity: .45; }
.card:hover .card-stripe { opacity: .85; width: 4px; }
.card.open .card-stripe { opacity: 1; width: 4px; }

.card-head-inner {
  display: flex;
  align-items: center;
  flex: 1;
  gap: 10px;
  padding: 12px 14px 12px 12px;
  min-width: 0;
  transition: background-color 140ms ease;
}

.card-head:hover .card-head-inner {
  background: var(--hover-ol);
}

.card-text { flex: 1; min-width: 0; }

.card-category {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: hsl(var(--ch) var(--cs, 65%) var(--cat-l, 36%));
  margin-bottom: 1px;
  transition: color 180ms ease;
}

.card-name {
  display: block;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text);
  overflow-wrap: anywhere;
  transition: color 140ms ease;
}

.card-summary {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  margin-top: 3px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--muted);
  overflow-wrap: anywhere;
  font-weight: 400;
  transition: color 140ms ease;
}

.open .card-summary {
  display: block;
  -webkit-line-clamp: unset;
}

/* Chevron toggle — smooth rotation with spring */
.chevron {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dim);
  transition: transform 260ms var(--ease-spring), color 160ms ease;
}

.card-head:hover .chevron { color: var(--muted); }
.chevron svg { width: 12px; height: 12px; transition: transform 260ms var(--ease-spring); }
.open .chevron { transform: rotate(180deg); color: var(--accent); }

/* ─── Card body / smooth accordion expansion ────────────────────────────── */
.card-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 240ms var(--ease-out), opacity 200ms ease, border-color 200ms ease;
  opacity: 0;
  border-top: 1px solid transparent;
  margin: 0 0 0 4px;
}

.card.open .card-body {
  grid-template-rows: 1fr;
  opacity: 1;
  border-top-color: var(--border-soft);
}

.card-body-inner {
  overflow: hidden;
  min-height: 0;
  padding: 0 16px 0 12px;
  transition: padding 240ms var(--ease-out);
}

.card.open .card-body-inner {
  padding: 4px 16px 14px 12px;
}

/* Field rows — two-column grid: label | value */
.field-row {
  display: grid;
  grid-template-columns: 128px 1fr;
  gap: 2px 12px;
  padding: 7px 4px;
  border-bottom: 1px solid var(--border-soft);
  align-items: baseline;
  border-radius: var(--radius-sm);
  transition: background-color 140ms ease;
}

.field-row:hover {
  background: var(--hover-ol);
}

.field-row:last-child { border-bottom: none; }

.field-key {
  font-size: 12px;
  font-weight: 500;
  color: var(--dim);
  letter-spacing: .01em;
  padding-top: 1px;
  transition: color 140ms ease;
}

.field-row:hover .field-key {
  color: var(--muted);
}

.field-val {
  font-size: 14px;
  color: var(--text);
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
  line-height: 1.55;
}

.field-sub {
  position: relative;
  padding-left: 12px;
  margin-top: 3px;
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.5;
}

.field-sub::before {
  content: "";
  position: absolute;
  left: 2px;
  top: .62em;
  width: 4px;
  height: 1.5px;
  background: var(--border);
  border-radius: 1px;
  transition: background-color 140ms ease;
}

.card-note {
  font-size: 13.5px;
  color: var(--muted);
  padding: 7px 4px;
  border-bottom: 1px solid var(--border-soft);
  line-height: 1.6;
  border-radius: var(--radius-sm);
  transition: background-color 140ms ease;
}

.card-note:hover {
  background: var(--hover-ol);
}

.card-note:last-child { border-bottom: none; padding-bottom: 4px; }

/* ─── Empty / error states ──────────────────────────────────────────────── */
.state-empty {
  padding: 56px 0;
  text-align: center;
  color: var(--muted);
  animation: itemSlideFade 280ms var(--ease-out) both;
}

.state-empty-icon {
  font-size: 36px;
  margin-bottom: 14px;
  opacity: .5;
  display: inline-block;
  animation: floatSlow 3.2s ease-in-out infinite;
}

.state-empty p { font-size: 14px; color: var(--muted); margin-bottom: 2px; }
.state-empty p strong { font-weight: 500; color: var(--text); }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  margin-top: 16px;
  height: 32px;
  padding: 0 14px;

<script type="text/markdown" id="study-data">
# TESLA DOC

## CT

### CT Head (Brain), plain

* **Summary:** Fast scan for bleed, stroke, head injury.
* **Also known as:** CT brain, head CT, NCCT head
* **Prep:** None. Remove hairpins, earrings, glasses.
* **Duration:** 10 minutes
* **Contrast:** No
* **Report:** Same day
* **Pregnancy:** Tell the radiographer before the scan.

### CT Abdomen and Pelvis with contrast

* **Summary:** Detailed scan of abdomen and pelvis organs. Needs contrast.
* **Also known as:** CT KUB with contrast, CECT abdomen, triple phase CT
* **Prep:**
* Fasting **overnight** (or minimum 6 hours).
* Requires creatinine report, bystander, and previous reports if any.


* **Creatinine report:** Required if age over 60, diabetes, or kidney disease.
* **Contrast allergy:** Do not book. Send to radiologist for review.
* **Duration:** 30 minutes
* **Report:** Same day

### CT Chest (HRCT)

* **Summary:** Detailed lung scan. Used for scarring, infection, nodules.
* **Also known as:** HRCT thorax, CT thorax, lung CT
* **Prep:** None. Patient must hold breath for a few seconds.
* **Contrast:** Usually no. Radiologist decides.
* **Duration:** 15 minutes
* **Report:** Same day

### CT Coronary Angiography

* **Summary:** Heart artery scan with contrast. Heart rate must be low and steady.
* **Also known as:** CTCA, cardiac CT, CT angio heart
* **Prep:**
* No tea, coffee, cola, or energy drinks for **12 hours**.
* Fasting **4 hours**.


* **Heart rate:** Below 65 beats per minute. Doctor may give a tablet.
* **Creatinine report:** Required.
* **Duration:** 45 minutes

### CT KUB (Plain)

* **Summary:** Scan for kidney, ureter, and bladder stones.
* **Also known as:** Non-contrast CT KUB
* **Prep:** Patient must consume a lot of water before scanning. No fasting needed.

### CT Urogram

* **Summary:** Detailed imaging of the urinary tract with contrast.
* **Also known as:** CT KUB + Contrast
* **Prep:** Overnight fasting, creatinine report, bystander, and old reports required.

### CT Enterography

* **Summary:** Detailed imaging of the small intestine.
* **Prep:** Same as CECT Abdomen preparation. Contrast bill included.

## MRI

### MRI Brain

* **Summary:** Detailed brain scan. No radiation.
* **Also known as:** MR brain, MRI head
* **Implants:**
* Pacemaker: **do not book** unless the device card says MR-conditional.
* Brain aneurysm clip, cochlear implant: send to radiologist first.


* **Claustrophobia:** Ask. Offer open scanner or sedation advice from doctor.
* **Duration:** 30 to 40 minutes
* **Contrast:** Only if the doctor asks.

### MRI Lumbar Spine

* **Summary:** Lower back, discs, and nerves.
* **Also known as:** MRI LS spine, MR lumbar, back MRI
* **Implants:** Same safety questions as MRI Brain.
* **Duration:** 30 minutes
* **Report:** Next day

### MRI Knee

* **Summary:** Ligament, meniscus, and cartilage injury.
* **Also known as:** MR knee
* **Duration:** 25 minutes
* **Report:** Next day

### MRI Pelvis

* **Summary:** Uterus, ovaries, prostate, and pelvic bones.
* **Also known as:** MR pelvis, MRI prostate, MRI uterus
* **Prep:** Fasting **4 hours**. Empty bladder 1 hour before.
* **Contrast:** Often needed. Creatinine report required.
* **Duration:** 40 minutes

### MRI MRCP

* **Summary:** Detailed evaluation of biliary and pancreatic ducts.
* **Prep:** 6 hours proper fasting without water consumption. Prescription and previous reports required.

### MRI Enterography

* **Summary:** Detailed MRI scan of the small bowel.
* **Prep:** Same as CECT Abdomen preparation. Contrast bill included.

### MRI Urogram

* **Summary:** Detailed MRI evaluation of the urinary system.
* **Prep:** Same as CECT Abdomen preparation. Contrast bill included.

### MRI Whole Spine

* **Prep:** Generally no fasting required. Remove metallic objects. Inform radiology team about implants/pacemakers.

### MRI Liver

* **Prep:** Fasting required (~4 hours). Serum creatinine/eGFR required if contrast is planned.

## Ultrasound

### Ultrasound Abdomen

* **Summary:** Liver, gallbladder, kidneys, pancreas, spleen.
* **Also known as:** USG abdomen, upper abdomen scan
* **Prep:** Fasting **6 hours**. Water is allowed.
* **Duration:** 20 minutes
* **Report:** Same day

### Ultrasound Pelvis

* **Summary:** Uterus, ovaries, bladder. Full bladder needed.
* **Also known as:** USG pelvis, TAS, transabdominal scan
* **Prep:** Drink **1 litre** of water, finish **1 hour** before. Do not pass urine.
* **Duration:** 15 minutes
* **Note:** Internal (transvaginal) scan needs an empty bladder. The doctor decides.

### Ultrasound Pregnancy (Dating and NT)

* **Summary:** First trimester scan. Checks dating and baby development.
* **Also known as:** NT scan, nuchal translucency, early pregnancy scan, dating scan
* **Timing:** Between **11 weeks and 13 weeks 6 days**.
* **Prep:** Comfortable bladder. Drink water if instructed.
* **Duration:** 30 minutes
* **Bring:** Previous scans and doctor referral.

### Ultrasound Thyroid

* **Summary:** Neck lumps and thyroid size.
* **Also known as:** USG neck, thyroid scan
* **Prep:** None. Remove necklaces.
* **Duration:** 15 minutes

### Doppler Lower Limb (Venous)

* **Summary:** Checks leg veins for clots or weak valves.
* **Also known as:** Venous Doppler, DVT scan, leg Doppler
* **Prep:** None. Wear loose clothing.
* **Duration:** 30 minutes
* **Urgent:** Sudden leg swelling and pain: escalate to supervisor for same-day slot.

### Ultrasound Carotid Doppler

* **Summary:** Evaluation of carotid arteries in the neck for blood flow and blockages.
* **Booking requirement:** Requires 4 slots (minimum 20 mins total).
* **Performed by:** Dr. Saji or Dr. Vimal.

### Shear Wave Elastography

* **Prep:** Fasting **4 to 6 hours**. Avoid food and sugary beverages during fasting.

## Lab Tests

### Fasting Blood Sugar

* **Summary:** Blood glucose after fasting.
* **Also known as:** FBS, FBG, fasting glucose
* **Prep:** Fasting **8 to 10 hours**. Water is allowed.
* **Sample:** Blood
* **Report:** Same day

### Postprandial Blood Sugar

* **Summary:** Blood glucose level after meals.
* **Also known as:** PPBS, PP Blood Sugar
* **Prep:** Blood collection exactly **2 hours** after starting a meal.
* **Sample:** Blood

### HbA1c

* **Summary:** Average blood sugar over the last 3 months.
* **Also known as:** Glycated haemoglobin, A1c, glycosylated Hb
* **Prep:** None. No fasting needed.
* **Sample:** Blood
* **Report:** Same day

### Lipid Profile

* **Summary:** Cholesterol and triglycerides.
* **Also known as:** Cholesterol test, LDL HDL, lipid panel
* **Prep:** Fasting **10 to 12 hours**. Water is allowed.
* **Sample:** Blood
* **Report:** Same day

### Complete Blood Count

* **Summary:** Red cells, white cells, platelets.
* **Also known as:** CBC, FBC, hemogram, full blood count
* **Prep:** None.
* **Sample:** Blood
* **Report:** Same day

### Thyroid Profile

* **Summary:** Thyroid hormone levels.
* **Also known as:** TSH, T3 T4, TFT, thyroid function test
* **Prep:** None. Tell the lab if the patient takes biotin supplements.
* **Sample:** Blood
* **Report:** Same day

### Vitamin D

* **Summary:** Vitamin D level in blood.
* **Also known as:** 25-OH vitamin D, 25 hydroxy cholecalciferol
* **Prep:** None.
* **Sample:** Blood
* **Report:** Next day

### Renal Function Test

* **Summary:** Kidney function assessment including urea, creatinine, and electrolytes.
* **Also known as:** RFT

### Liver Function Test

* **Summary:** Liver enzyme and protein assessment.
* **Also known as:** LFT
* **Prep:** Avoid alcohol before testing; GGT requires following lab guidelines.

### Urine Routine Examination / Analysis

* **Summary:** Standard urine check.
* **Prep:** First morning midstream sample preferred using a clean container.

### Microalbuminuria

* **Summary:** Urinary albumin test for early kidney damage.
* **Prep:** Midstream urine sample.

### Allergy Panels

* **Alex2:** 300 Allergens (₹12,500)
* **Fox:** 286 Food Antigens (₹12,000)
* **Prep:** No fasting required.

  /* ── helpers ───────────────────────────────────────────────────────── */
  const esc  = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const tokens = s => norm(s).match(/[\p{L}\p{M}\p{N}]+/gu) || [];
  // Returns {h, s} for a category name — always violet-family
  const palette = name => PALETTE[Math.max(0, cats.findIndex(c => c.name === name)) % PALETTE.length];
  const paletteStyle = name => { const [h,s] = palette(name); return `--ch:${h};--cs:${s}%`; };

  /* ── README parser ─────────────────────────────────────────────────── */
  function parse(md) {
    md = md.replace(/<!--[\s\S]*?-->/g, '');
    let title = '', cat = null, cur = null, last = null, fence = false;
    const catList = [], out = [];

    for (const raw of md.split(/\r?\n/)) {
      const line = raw.replace(/\s+$/, '');
      if (/^\s*(```|~~~)/.test(line)) { fence = !fence; continue; }
      if (fence) continue;

      let m;
      if ((m = line.match(/^#\s+(.+)/)))   { title = title || m[1].trim(); continue; }
      if ((m = line.match(/^##\s+(.+)/)))  {
        const name = m[1].trim();
        cat = catList.find(c => c.name === name);
        if (!cat) { cat = {name, n: 0}; catList.push(cat); }
        cur = null; last = null; continue;
      }
      if ((m = line.match(/^###\s+(.+)/))) {
        if (!cat) { cat = {name: 'General', n: 0}; catList.push(cat); }
        cur = {name: m[1].trim(), cat: cat.name, fields: []};
        out.push(cur); cat.n++; last = null; continue;
      }
      if (!cur || !line.trim()) continue;

      if ((m = line.match(/^(?:\s{2,}|\t+)[-*+]\s+(.*)/)) && last) {
        last.lines.push({t: m[1], sub: true}); continue;
      }
      let text = line.trim();
      if ((m = line.match(/^[-*+]\s+(.*)/))) {
        text = m[1];
        const f = text.match(/^\*{0,2}(\p{L}[^:*]{0,31}?)\*{0,2}:\*{0,2}\s*(.*)$/u);
        if (f) {
          last = {key: f[1].trim(), lines: f[2] ? [{t: f[2], sub: false}] : []};
          cur.fields.push(last); continue;
        }
      }
      cur.fields.push({key: '', lines: [{t: text, sub: false}]});
      last = null;
    }
    return {title, cats: catList, studies: out};
  }

  /* ── search index ──────────────────────────────────────────────────── */
  const ALIAS_KEYS = /^(also known as|aka|alias|aliases|keywords?|tags?|codes?|other names?)$/i;
  function index(list) {
    const plain = f => (f.key + ' ' + f.lines.map(l => l.t).join(' ')).replace(/\*\*/g, '');
    list.forEach((s, i) => {
      s.i = i;
      const sf = s.fields.find(f => /^summary$/i.test(f.key)) || s.fields.find(f => f.key);
      s.summary = sf ? sf.lines.map(l => l.t).join(' ') : '';
      s.rest = s.fields.filter(f => f !== sf);
      const alias = s.fields.filter(f => ALIAS_KEYS.test(f.key));
      s.z = {
        name:  tokens(s.name),
        alias: tokens(alias.map(plain).join(' ')),
        cat:   tokens(s.cat),
        body:  tokens(s.fields.map(plain).join(' ')),
      };
      s.hay = norm([s.name, s.cat, ...s.fields.map(plain)].join(' '));
    });
  }

  function near(a, b) {
    const d = a.length >= 8 ? 2 : 1;
    if (Math.abs(a.length - b.length) > d) return false;
    let prev = Array.from({length: b.length + 1}, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length] <= d;
  }

  const ZONES = [['name', 10], ['alias', 6], ['cat', 3], ['body', 1]];
  function termScore(t, s, fuzzy) {
    let best = 0;
    for (const [z, w] of ZONES) {
      for (const tok of s.z[z]) {
        let k = 0;
        if (tok === t) k = 3;
        else if (tok.startsWith(t)) k = 2;
        else if (fuzzy && t.length >= 4 && (near(t, tok) || near(t, tok.slice(0, t.length)))) k = 1;
        if (k * w > best) best = k * w;
      }
    }
    if (!best && t.length >= 3 && s.hay.includes(t)) best = 1;
    return best;
  }

  function search(terms) {
    const pool = studies.filter(s => !activeCat || s.cat === activeCat);
    if (!terms.length) return {items: pool, fuzzy: false};
    for (const fuzzy of [false, true]) {
      const hits = [];
      for (const s of pool) {
        let total = 0, ok = true;
        for (const t of terms) {
          const sc = termScore(t, s, fuzzy);
          if (!sc) { ok = false; break; }
          total += sc;
        }
        if (ok) hits.push({s, total});
      }
      if (hits.length) {
        hits.sort((a, b) => b.total - a.total || a.s.i - b.s.i);
        return {items: hits.map(h => h.s), fuzzy};
      }
    }
    return {items: [], fuzzy: false};
  }

  /* ── rendering ─────────────────────────────────────────────────────── */
  const hi = text => re
    ? text.split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('')
    : esc(text);
  const inline = t => t.split(/\*\*(.+?)\*\*/).map((p, i) => i % 2 ? '<strong>' + hi(p) + '</strong>' : hi(p)).join('');

  function card(s, showCat, open, animIndex = 0) {
    const ps = paletteStyle(s.cat);

    const rows = s.rest.map(f => {
      if (!f.key) {
        return `<p class="card-note">${f.lines.map(l => inline(l.t)).join('<br>')}</p>`;
      }
      const valLines = f.lines.map(l =>
        `<div class="${l.sub ? 'field-sub' : ''}">${inline(l.t)}</div>`
      ).join('');
      return `<div class="field-row">
        <span class="field-key">${hi(f.key)}</span>
        <div class="field-val">${valLines}</div>
      </div>`;
    }).join('');

    return `<article class="card${open ? ' open' : ''}" style="${ps};--anim-i:${Math.min(animIndex, 12)}" data-id="${s.i}">
      <button class="card-head" type="button" aria-expanded="${open}" aria-controls="b${s.i}">
        <span class="card-stripe" aria-hidden="true"></span>
        <span class="card-head-inner">
          <span class="card-text">
            ${showCat ? `<span class="card-category">${esc(s.cat)}</span>` : ''}
            <span class="card-name">${inline(s.name)}</span>
            ${s.summary ? `<span class="card-summary">${inline(s.summary)}</span>` : ''}
          </span>
          <span class="chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </span>
      </button>
      <div class="card-body" id="b${s.i}">
        <div class="card-body-inner">${rows}</div>
      </div>
    </article>`;
  }

  /* ── dashboard renderer ───────────────────────────────────────────── */
  function renderDashboard(q) {
    if (!dashboardData || !dashboardData.length) {
      els.status.textContent = 'Dashboard · Call Center Metrics';
      els.list.innerHTML = `<div class="state-empty">
        <div class="state-empty-icon">📊</div>
        <p><strong>No dashboard data found</strong></p>
        <p>Append your daily records to <code>data.txt</code> and run <code>python3 update_dashboard.py</code> to sync.</p>
      </div>`;
      return;
    }

    const normQ = norm(q);
    const cleanNumQ = q.replace(/[\s-]/g, '');

    // Available dates in data
    const allDates = [...new Set(dashboardData.map(d => d.date))];

    // Filter target days for summary cards:
    let activeDays = dashboardData;
    if (dashSelectedDate) {
      activeDays = dashboardData.filter(d => d.date === dashSelectedDate);
    } else if (normQ && !/^\d{5,}$/.test(cleanNumQ)) {
      // Check if q matches date (e.g. 18/11 or 18.11 or 2026)
      const matchingDates = dashboardData.filter(d => {
        const dNorm = norm(d.date);
        return dNorm.includes(normQ) || dNorm.replace(/[/.]/g, '-').includes(normQ.replace(/[/.]/g, '-'));
      });
      if (matchingDates.length > 0) {
        activeDays = matchingDates;
      }
    }

    // Aggregate metrics across activeDays
    let totalConfirmedBookingsCount = 0;
    let totalTodayBookings = 0;
    let totalTmrwBookings = 0;
    let totalEnquiries = 0;
    let totalWalkIns = 0;
    let totalConversions = 0;

    const modAggregates = {};

    activeDays.forEach(day => {
      totalConfirmedBookingsCount += (day.bookings ? day.bookings.length : 0);
      if (day.metrics) {
        for (const [mod, met] of Object.entries(day.metrics)) {
          if (!modAggregates[mod]) modAggregates[mod] = {};
          for (const [k, v] of Object.entries(met)) {
            if (/YET TO CONFIRM/i.test(k)) continue; // ignore unconfirmed enquiry
            if (typeof v === 'number') {
              modAggregates[mod][k] = (modAggregates[mod][k] || 0) + v;
              if (/BOOKINGS? TAKEN FOR TODAY/i.test(k)) totalTodayBookings += v;
              else if (/BOOKINGS? FOR TOMORROW/i.test(k)) totalTmrwBookings += v;
              else if (/TOTAL ENQUIRY/i.test(k)) totalEnquiries += v;
              else if (/WALK IN/i.test(k)) totalWalkIns += v;
              else if (/CONVERSION/i.test(k)) totalConversions += v;
            } else {
              modAggregates[mod][k] = v;
            }
          }
        }
      }
    });

    // Gather bookings
    const bookingsSource = dashSelectedDate ? activeDays : dashboardData;
    let allBookings = [];
    bookingsSource.forEach(d => {
      if (d.bookings) allBookings.push(...d.bookings);
    });

    // Filter bookings if modality filter or search query is present
    let filteredBookings = allBookings;
    if (dashSelectedModality) {
      filteredBookings = filteredBookings.filter(b => b.modality && b.modality.toUpperCase() === dashSelectedModality.toUpperCase());
    }

    if (normQ) {
      filteredBookings = filteredBookings.filter(b => {
        const phoneMatch = cleanNumQ.length >= 3 && b.phone && b.phone.replace(/[\s-]/g, '').includes(cleanNumQ);
        const nameMatch = b.name && norm(b.name).includes(normQ);
        const dateMatch = (b.date && norm(b.date).includes(normQ)) || (b.logged_date && norm(b.logged_date).includes(normQ));
        const timeMatch = b.time && norm(b.time).includes(normQ);
        const modMatch = b.modality && norm(b.modality).includes(normQ);
        return phoneMatch || nameMatch || dateMatch || timeMatch || modMatch;
      });
    }

    // Status line update
    if (normQ) {
      els.status.textContent = `Dashboard · Search "${esc(q)}" · ${filteredBookings.length} booking match${filteredBookings.length === 1 ? '' : 'es'}`;
    } else if (dashSelectedDate) {
      els.status.textContent = `Dashboard · Date: ${dashSelectedDate} · ${filteredBookings.length} confirmed bookings`;
    } else {
      els.status.textContent = `Dashboard · Summary (${allDates.length} logged day${allDates.length === 1 ? '' : 's'}) · ${totalConfirmedBookingsCount} confirmed bookings`;
    }

    // Build HTML
    let html = `<div class="dash-view">`;

    // 1. Controls — Date dropdown + Modality pills
    const allMods = Object.keys(modAggregates).map(m => m.replace(/\s+SCAN$/i, ''));
    html += `<div class="dash-controls">
      <div class="dash-filter-group">
        <span class="dash-filter-label">Date:</span>
        <div class="dash-select-wrap">
          <select class="dash-select" id="dash-date-select" aria-label="Filter by date">
            <option value="ALL"${!dashSelectedDate ? ' selected' : ''}>All Dates (Summary)</option>`;
    allDates.forEach(date => {
      html += `<option value="${esc(date)}"${dashSelectedDate === date ? ' selected' : ''}>${esc(date)}</option>`;
    });
    html += `</select>
          <svg class="dash-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="dash-filter-group">
        <span class="dash-filter-label">Modality:</span>
        <button class="dash-pill ${!dashSelectedModality ? 'active' : ''}" type="button" data-dash-mod="ALL" aria-pressed="${!dashSelectedModality}">All</button>`;
    allMods.forEach(shortMod => {
      const active = dashSelectedModality === shortMod;
      html += `<button class="dash-pill ${active ? 'active' : ''}" type="button" data-dash-mod="${esc(shortMod)}" aria-pressed="${active}">${esc(shortMod)}</button>`;
    });
    html += `</div></div>`;

    // 2. Summary KPI cards
    const subtitle = dashSelectedDate ? `Logged on ${dashSelectedDate}` : `Across ${allDates.length} logged day${allDates.length === 1 ? '' : 's'}`;
    html += `<div class="dash-kpis">
      <div class="dash-kpi">
        <div class="dash-kpi-val">${totalConfirmedBookingsCount}</div>
        <div class="dash-kpi-label">Confirmed Bookings</div>
        <div class="dash-kpi-sub">${subtitle}</div>
      </div>
      <div class="dash-kpi">
        <div class="dash-kpi-val">${totalTodayBookings}</div>
        <div class="dash-kpi-label">Today's Bookings</div>
        <div class="dash-kpi-sub">All modalities</div>
      </div>
      <div class="dash-kpi">
        <div class="dash-kpi-val">${totalTmrwBookings}</div>
        <div class="dash-kpi-label">Tomorrow's Bookings</div>
        <div class="dash-kpi-sub">All modalities</div>
      </div>`;

    if (totalEnquiries > 0) {
      html += `<div class="dash-kpi">
        <div class="dash-kpi-val">${totalEnquiries}</div>
        <div class="dash-kpi-label">Total Enquiries</div>
        <div class="dash-kpi-sub">Logged enquiries</div>
      </div>`;
    }
    if (totalWalkIns > 0) {
      html += `<div class="dash-kpi">
        <div class="dash-kpi-val">${totalWalkIns}</div>
        <div class="dash-kpi-label">Walk-ins</div>
        <div class="dash-kpi-sub">Direct walk-ins</div>
      </div>`;
    }
    if (totalConversions > 0) {
      html += `<div class="dash-kpi">
        <div class="dash-kpi-val">${totalConversions}</div>
        <div class="dash-kpi-label">Conversions</div>
        <div class="dash-kpi-sub">Converted bookings</div>
      </div>`;
    }
    html += `</div>`;

    // 3. Modality Breakdown Cards
    html += `<div>
      <div class="dash-section-title">
        <span>Modality Breakdown</span>
        <span>${dashSelectedDate || 'Aggregated Total'}</span>
      </div>
      <div class="dash-modalities">`;

    for (const [mod, met] of Object.entries(modAggregates)) {
      const shortMod = mod.replace(/\s+SCAN$/i, '');
      if (dashSelectedModality && dashSelectedModality.toUpperCase() !== shortMod.toUpperCase()) {
        continue;
      }
      html += `<div class="dash-mod-card">
        <div class="dash-mod-head">
          <span class="dash-mod-title">${esc(mod)}</span>
          <span class="dash-badge">${shortMod}</span>
        </div>
        <div class="dash-mod-body">`;
      for (const [k, v] of Object.entries(met)) {
        if (/YET TO CONFIRM/i.test(k)) continue;
        html += `<div class="dash-mod-row">
          <span class="k">${esc(k)}</span>
          <span class="v">${esc(String(v))}</span>
        </div>`;
      }
      html += `</div></div>`;
    }
    html += `</div></div>`;

    // 4. Confirmed Bookings Table (Row-wise information)
    html += `<div class="dash-bookings-box">
      <div class="dash-bookings-head">
        <div class="dash-bookings-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.8"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          <span>Confirmed Bookings</span>
          <span class="dash-badge">${filteredBookings.length}</span>
        </div>
        <span class="dash-date-badge">${normQ ? 'Filtered by: "' + esc(q) + '"' : (dashSelectedDate ? 'Date: ' + esc(dashSelectedDate) : 'Showing all confirmed bookings')}</span>
      </div>`;

    if (!filteredBookings.length) {
      html += `<div class="dash-empty">
        <p>No confirmed bookings found${normQ ? ' matching <strong>"' + esc(q) + '"</strong>' : ''}.</p>
        <p style="margin-top:6px; font-size:12px; color:var(--dim);">Tip: You can search by phone number (e.g. 8089...), patient name, date, or time.</p>
      </div>`;
    } else {
      html += `<div class="dash-table-wrap">
        <table class="dash-table">
          <thead>
            <tr>
              <th class="dash-td-num">#</th>
              <th>Patient</th>
              <th>Phone</th>
              <th>Appointment Slot</th>
              <th class="dash-td-mod">Modality</th>
              <th class="dash-td-date">Logged</th>
            </tr>
          </thead>
          <tbody>`;

      filteredBookings.forEach((b, idx) => {
        let hlName = esc(b.name || '');
        let hlPhone = esc(b.phone || '');
        if (normQ) {
          try {
            const rx = new RegExp('(' + esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            hlName = hlName.replace(rx, '<mark>$1</mark>');
            hlPhone = hlPhone.replace(rx, '<mark>$1</mark>');
          } catch (_) {}
        }
        const cleanPhoneTel = (b.phone || '').replace(/[^0-9+]/g, '');
        const slotStr = (b.date || '') + (b.time ? ' · ' + b.time : '');

        html += `<tr>
          <td class="dash-td-num">${idx + 1}</td>
          <td class="dash-td-name">${hlName}</td>
          <td class="dash-td-phone">
            <a href="tel:${cleanPhoneTel}" class="dash-phone-link" title="Click to call ${cleanPhoneTel}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <span>${hlPhone}</span>
            </a>
          </td>
          <td class="dash-td-slot">
            <span class="dash-slot-tag">${esc(slotStr)}</span>
          </td>
          <td class="dash-td-mod">
            <span class="dash-badge">${esc(b.modality || 'MRI')}</span>
          </td>
          <td class="dash-td-date">${esc(b.logged_date || '')}</td>
        </tr>`;
      });

      html += `</tbody></table></div>`;
    }

    html += `</div></div>`;
    els.list.innerHTML = html;

    // After render, wire up the select dropdown (can't use inline onchange in CSP-safe way)
    const dateSelect = document.getElementById('dash-date-select');
    if (dateSelect) {
      dateSelect.addEventListener('change', () => {
        dashSelectedDate = dateSelect.value === 'ALL' ? null : dateSelect.value;
        render();
      });
    }
  }

  /* ── calendar helpers ───────────────────────────────────────────────── */
  function parseBookingToISODate(b) {
    let dateStr = (b.date || '').trim();
    const up = dateStr.toUpperCase();
    if (!dateStr || up === 'TODAY' || /^WALK/i.test(up)) {
      dateStr = b.logged_date || '';
    } else if (up === 'TOMORROW') {
      const p = (b.logged_date || '').split(/[/.-]/);
      if (p.length >= 3) {
        let d = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, y = parseInt(p[2], 10);
        if (y < 100) y += 2000;
        const dt = new Date(y, m, d + 1);
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      }
    }
    const p = dateStr.split(/[/.-]/);
    if (p.length >= 3) {
      let d = parseInt(p[0], 10), m = parseInt(p[1], 10), y = parseInt(p[2], 10);
      if (y < 100) y += 2000;
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
    // Fallback: use logged_date
    if (b.logged_date) {
      const lp = b.logged_date.split(/[/.-]/);
      if (lp.length >= 3) {
        let d = parseInt(lp[0], 10), m = parseInt(lp[1], 10), y = parseInt(lp[2], 10);
        if (y < 100) y += 2000;
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }
    }
    return null;
  }

  function parseTimeMinutes(timeStr) {
    if (!timeStr) return 9999;
    const clean = timeStr.trim().toUpperCase();
    if (/WALK/i.test(clean)) return 9998;
    const m = clean.match(/^(\d{1,2})(?:[.:](\d{2}))?\s*(AM|PM)?$/i);
    if (!m) return 9999;
    let h = parseInt(m[1], 10);
    const min = m[2] ? parseInt(m[2], 10) : 0;
    const mer = m[3] ? m[3].toUpperCase() : '';
    if (mer === 'PM' && h < 12) h += 12;
    if (mer === 'AM' && h === 12) h = 0;
    return h * 60 + min;
  }

  function buildBookingsByDate() {
    const map = {};
    dashboardData.forEach(d => {
      (d.bookings || []).forEach(b => {
        const iso = parseBookingToISODate(b);
        if (!iso) return;
        if (!map[iso]) map[iso] = [];
        map[iso].push(b);
      });
    });
    return map;
  }

  /* ── calendar renderer ──────────────────────────────────────────────── */
  function renderCalendar() {
    const today = new Date();
    if (!calViewDate) {
      calViewDate = { year: today.getFullYear(), month: today.getMonth(), day: today.getDate() };
    }

    const { year, month } = calViewDate;
    const selectedDay = calViewDate.selectedDay || null;
    const bookingsByDate = buildBookingsByDate();

    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const firstDayOfMonth = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    // Status line
    const selectedISO = selectedDay ? `${year}-${String(month + 1).padStart(2, '0')}-${String(selectedDay).padStart(2, '0')}` : null;
    const selectedBookings = selectedISO ? (bookingsByDate[selectedISO] || []) : [];
    const totalBookingsInMonth = Object.entries(bookingsByDate)
      .filter(([k]) => k.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`))
      .reduce((acc, [, v]) => acc + v.length, 0);

    if (selectedDay) {
      els.status.textContent = `Calendar · ${MONTHS[month]} ${selectedDay}, ${year} · ${selectedBookings.length} booking${selectedBookings.length === 1 ? '' : 's'}`;
    } else {
      els.status.textContent = `Calendar · ${MONTHS[month]} ${year} · ${totalBookingsInMonth} booking${totalBookingsInMonth === 1 ? '' : 's'} this month`;
    }

    let html = `<div class="cal-view">`;

    // Mini calendar card
    html += `<div class="cal-card">
      <div class="cal-head">
        <div class="cal-title-wrap">
          <span class="cal-month-title">${MONTHS[month]} ${year}</span>
          <button class="cal-today-btn" type="button" data-cal-today="1">Today</button>
        </div>
        <div class="cal-nav-group">
          <button class="cal-nav-btn" type="button" data-cal-nav="-1" aria-label="Previous month">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="cal-nav-btn" type="button" data-cal-nav="1" aria-label="Next month">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <div class="cal-grid">`;

    // Week day headers
    DAYS.forEach(d => { html += `<div class="cal-weekday">${d}</div>`; });

    // Empty cells before first day
    for (let i = 0; i < firstDayOfMonth; i++) {
      html += `<div class="cal-day empty"></div>`;
    }

    // Day cells
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const hasBookings = !!(bookingsByDate[iso] && bookingsByDate[iso].length);
      const count = hasBookings ? bookingsByDate[iso].length : 0;
      const isToday = (d === today.getDate() && month === today.getMonth() && year === today.getFullYear());
      const isSelected = (selectedDay === d);

      let cls = 'cal-day';
      if (hasBookings) cls += ' has-bookings';
      if (isToday) cls += ' today';
      if (isSelected) cls += ' selected';

      html += `<div class="${cls}" data-cal-day="${d}" title="${count} booking${count === 1 ? '' : 's'} on ${d} ${MONTHS[month]}">
        <span>${d}</span>
        ${hasBookings ? `<div class="cal-dot"></div>` : ''}
      </div>`;
    }

    html += `</div></div>`; // end cal-grid, cal-card

    // Booking schedule for selected day
    html += `<div class="cal-schedule-box">
      <div class="cal-schedule-head">
        <div class="cal-schedule-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>${selectedDay ? `${selectedDay} ${MONTHS[month]} ${year}` : 'Select a date'}</span>
          ${selectedDay ? `<span class="dash-badge">${selectedBookings.length}</span>` : ''}
        </div>
        ${selectedDay ? `<span class="dash-date-badge">Tap a date in the calendar above</span>` : ''}
      </div>`;

    if (!selectedDay) {
      // Show dates that have bookings as quick picks
      const datesWithBookings = Object.keys(bookingsByDate)
        .filter(k => k.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`))
        .sort();
      html += `<div class="cal-empty-state">
        <p>Tap a date on the calendar to view its bookings.</p>`;
      if (datesWithBookings.length > 0) {
        html += `<div class="cal-quick-dates">`;
        datesWithBookings.forEach(iso => {
          const d = parseInt(iso.split('-')[2], 10);
          const cnt = bookingsByDate[iso].length;
          html += `<button class="cal-quick-date-btn" type="button" data-cal-day="${d}">${d} ${MONTHS[month].slice(0, 3)} · ${cnt}</button>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    } else if (selectedBookings.length === 0) {
      html += `<div class="cal-empty-state"><p>No confirmed bookings on this date.</p></div>`;
    } else {
      const sorted = [...selectedBookings].sort((a, b) => parseTimeMinutes(a.time) - parseTimeMinutes(b.time));
      html += `<div class="cal-schedule-list">`;
      sorted.forEach((b, idx) => {
        const cleanPhone = (b.phone || '').replace(/[^0-9+]/g, '');
        const timeLabel = b.time || (b.date && /WALK/i.test(b.date) ? 'Walk-in' : '—');
        html += `<div class="cal-slot-row">
          <div class="cal-slot-left">
            <div class="cal-time-pill">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.75"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${esc(timeLabel)}
            </div>
            <div class="cal-patient-info">
              <div class="cal-patient-name">
                <span>${idx + 1}.</span> ${esc(b.name || '')}
                <span class="dash-badge">${esc(b.modality || 'MRI')}</span>
              </div>
              <a href="tel:${cleanPhone}" class="dash-phone-link" style="font-size:12px;" title="Call ${cleanPhone}">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                <span>${esc(b.phone || '')}</span>
              </a>
            </div>
          </div>
          <div class="cal-slot-right">
            <span class="cal-logged-badge">logged ${esc(b.logged_date || '')}</span>
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    html += `</div></div>`;
    els.list.innerHTML = html;
  }

  function render() {
    const q = els.q.value.trim();
    els.box.classList.toggle('has-q', !!q);

    if (activeCat === '__dashboard__') {
      els.q.placeholder = 'Search by date (e.g. 18/11/26), phone, patient name...';
      renderDashboard(q);
      return;
    }

    if (activeCat === '__calendar__') {
      els.q.placeholder = 'Calendar — tap a date to view bookings';
      renderCalendar();
      return;
    }

    els.q.placeholder = 'Search scans, prep, times, or keywords...';
    const terms = tokens(q);
    const hl    = [...new Set(terms.filter(t => t.length >= 3))];
    re = hl.length ? new RegExp('(' + hl.join('|') + ')', 'gi') : null;

    const {items, fuzzy} = search(terms);
    const n = items.length;
    let msg;
    if (!q) msg = `${n} ${n === 1 ? 'entry' : 'entries'}` + (activeCat ? ` · ${activeCat}` : '');
    else     msg = `${n} ${n === 1 ? 'result' : 'results'}` + (activeCat ? ` · ${activeCat}` : '') + (fuzzy ? ' · approx. match' : '');
    els.status.textContent = msg;

    if (!n) {
      els.list.innerHTML = `<div class="state-empty">
        <div class="state-empty-icon">🔍</div>
        <p>No results for <strong>"${esc(q)}"</strong></p>
        <p>Try a shorter or different search term.</p>
        ${activeCat ? '<button class="btn-ghost" id="all" type="button">Search all categories</button>' : ''}
      </div>`;
      return;
    }

    const auto   = !!q && n <= 3;
    const isOpen = s => opened.has(s.i) ? opened.get(s.i) : auto;
    let html = '';
    let animCount = 0;

    if (!q && !activeCat) {
      for (const c of cats) {
        const g = items.filter(s => s.cat === c.name);
        if (!g.length) continue;
        const ps = paletteStyle(c.name);
        html += `<div class="group-header" style="${ps};--anim-i:${Math.min(animCount++, 12)}">
          <span class="cdot"></span>
          <span class="group-title">${esc(c.name)}</span>
          <span class="group-count">${g.length}</span>
        </div>` + g.map(s => card(s, false, isOpen(s), animCount++)).join('');
      }
    } else {
      const showCat = !!q && !activeCat;
      html = items.map((s, idx) => card(s, showCat, isOpen(s), idx)).join('');
    }
    els.list.innerHTML = html;
  }

  function renderChips() {
    const isDash = activeCat === '__dashboard__';
    const isCal  = activeCat === '__calendar__';
    const allPressed = !activeCat || activeCat === '';
    els.chips.innerHTML =
      `<button class="chip" type="button" data-cat="__dashboard__" aria-pressed="${isDash}">
        <span class="cdot" style="background:var(--accent);"></span>Dashboard
      </button>` +
      `<button class="chip" type="button" data-cat="__calendar__" aria-pressed="${isCal}">
        <span class="cdot" style="background:var(--accent);opacity:0.6;"></span>Calendar
      </button>` +
      `<button class="chip" type="button" data-cat="" aria-pressed="${allPressed}">All Studies</button>` +
      cats.map(c => {
        const ps = paletteStyle(c.name);
        return `<button class="chip" type="button" data-cat="${esc(c.name)}" aria-pressed="${activeCat === c.name}" style="${ps}">
          <span class="cdot"></span>${esc(c.name)}<span class="chip-count">${c.n}</span>
        </button>`;
      }).join('');
  }

  function fail(msg) {
    els.status.textContent = '';
    els.list.innerHTML = `<div class="state-error">${msg}</div>`;
  }

  /* ── events ────────────────────────────────────────────────────────── */
  const themeToggle = $('#theme-toggle');
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
        (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (_) {}
    });
  }

  els.q.addEventListener('input', render);
  els.q.addEventListener('keydown', e => { if (e.key === 'Enter') els.q.blur(); });
  els.clear.addEventListener('click', () => {
    els.q.value = '';
    render();
    els.q.focus();
  });

  const headerEl = document.querySelector('.app-header');
  window.addEventListener('scroll', () => {
    headerEl.classList.toggle('scrolled', window.scrollY > 4);
  }, {passive: true});

  window.addEventListener('touchmove', e => {
    if (document.activeElement === els.q && e.target !== els.q) els.q.blur();
  }, {passive: true});

  els.chips.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    activeCat = b.dataset.cat !== undefined ? b.dataset.cat : null;
    renderChips();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  els.list.addEventListener('click', e => {
    // Calendar nav (prev / next month)
    const calNav = e.target.closest('[data-cal-nav]');
    if (calNav) {
      const dir = parseInt(calNav.dataset.calNav, 10);
      if (!calViewDate) { const t = new Date(); calViewDate = { year: t.getFullYear(), month: t.getMonth(), selectedDay: null }; }
      calViewDate.month += dir;
      if (calViewDate.month > 11) { calViewDate.month = 0; calViewDate.year++; }
      if (calViewDate.month < 0)  { calViewDate.month = 11; calViewDate.year--; }
      calViewDate.selectedDay = null;
      renderCalendar();
      return;
    }

    // Calendar "Today" button
    if (e.target.closest('[data-cal-today]')) {
      const t = new Date();
      calViewDate = { year: t.getFullYear(), month: t.getMonth(), selectedDay: t.getDate() };
      renderCalendar();
      return;
    }

    // Calendar day cell or quick-date button
    const calDay = e.target.closest('[data-cal-day]');
    if (calDay) {
      const d = parseInt(calDay.dataset.calDay, 10);
      if (!calViewDate) { const t = new Date(); calViewDate = { year: t.getFullYear(), month: t.getMonth() }; }
      calViewDate.selectedDay = (calViewDate.selectedDay === d) ? null : d;
      renderCalendar();
      return;
    }

    const dateBtn = e.target.closest('[data-dash-date]');
    if (dateBtn) {
      const d = dateBtn.dataset.dashDate;
      dashSelectedDate = d === 'ALL' ? null : d;
      render();
      return;
    }

    const modBtn = e.target.closest('[data-dash-mod]');
    if (modBtn) {
      const m = modBtn.dataset.dashMod;
      dashSelectedModality = m === 'ALL' ? null : m;
      render();
      return;
    }

    if (e.target.closest('#all')) {
      activeCat = '';
      renderChips();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    const head = e.target.closest('.card-head');
    if (!head) return;
    const c = head.closest('.card');
    const open = !c.classList.contains('open');
    c.classList.toggle('open', open);
    head.setAttribute('aria-expanded', open);
    opened.set(+c.dataset.id, open);
  });

  /* ── load ──────────────────────────────────────────────────────────── */
  function load() {
    const dashEl = document.getElementById('dashboard-data');
    if (dashEl) {
      try {
        dashboardData = JSON.parse(dashEl.textContent.trim()) || [];
      } catch (err) {
        console.error('Failed to parse dashboard data:', err);
        dashboardData = [];
      }
    }

    const embeddedEl = document.getElementById('study-data');
    const text = embeddedEl ? embeddedEl.textContent.trim() : '';

    if (!text) {
      fail('No study data found in the <code>#study-data</code> section.');
      return;
    }

    const data = parse(text);
    if (!data.studies.length) {
      fail('No studies found. Put each study under a <code>###</code> heading inside a <code>##</code> category.');
      return;
    }

    document.title = data.title || 'TESLA DOC';
    els.title.textContent = data.title || 'TESLA DOC';
    cats = data.cats.filter(c => c.n > 0);
    studies = data.studies;
    index(studies);
    renderChips();
    render();
  }

  load();
})();
</script>
</body>
</html>
